[project]
name = "job-hunter"
version = "0.3.1"
description = "Personal job-hunting assistant: multi-source vacancy ingestion, analysis and profile-based ranking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "feedparser>=6.0",   # BSD-2 — каноничный парсер RSS/Atom, не пишем свой
    "rapidfuzz>=3.10",   # MIT — быстрое нечёткое сравнение строк для дедупа/перепостов
    "psutil>=6.0",       # BSD-3 — контроль свободной RAM для ресурс-политики LLM (PLAN §7.1)
    "pypdf>=5.0",        # BSD-3 — извлечение текста резюме из PDF
    "python-docx>=1.1",  # MIT — извлечение текста резюме из DOCX
    "fastapi>=0.115",    # MIT — web-слой (M3)
    "uvicorn>=0.30",     # BSD-3 — ASGI-сервер
    "jinja2>=3.1",       # BSD-3 — шаблоны с автоэскейпингом
    "apscheduler>=3.11", # MIT — фоновой планировщик сборов в web-процессе
    "python-multipart>=0.0.9",  # Apache-2.0 — парсинг POST-форм FastAPI
]

[project.scripts]
job-hunter = "job_hunter.presentation.cli:main"

[project.entry-points."job_hunter.connectors"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["job_hunter"]

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
strict = true
exclude = "(migrations/|tests/)"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["feedparser.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
