# Реестр требований Job Hunter (FR = функциональные, NFR = нефункциональные).
#
# ЛЕНИВЫЙ ПРОЦЕСС: запись появляется в момент, когда требование становится actionable
# (Definition of Ready — перед реализацией). Ретро-требования НЕ пишем; при касании
# старой фичи — дописываем. Как добавлять: .opencode/skills/spec/SKILL.md
# Валидация: uv run pytest tests/test_requirements_registry.py
#
# Поля записи:
#   id          FR-NNN | NFR-NNN (уникально, неизменно)
#   title       короткое имя
#   statement   что система должна делать (одним предложением, проверяемо)
#   acceptance  список критериев приёмки (каждый — «сделано/не сделано»)
#   priority    must | should | could
#   status      proposed | accepted | done | dropped
#   release     в какой релиз входит (например v0.4.0)
#   traces      сценарии F* (docs/DISCOVERY.md §5) и ограничения C* (docs/PRODUCT.md §3)
#   tests       имена тестов (tests/...::test_...) — обязательно для status done
#   notes       свободные примечания (риски, ссылки на ADR)

schema: 1
requirements:
  - id: FR-001
    title: Watchlist целевых компаний — управление
    statement: >-
      Владелец ведёт список целевых компаний (watchlist) через UI: добавляет и убирает
      компании с указанием типа источника и идентификатора (Greenhouse/Lever slug,
      hh employer-id); список хранится в БД и переживает перезапуск.
    acceptance:
      - Компания добавляется в watchlist через UI без ручной правки конфигов, с выбором типа источника и его идентификатора.
      - Компания удаляется из watchlist через UI; удаление не удаляет ранее собранные вакансии.
      - Watchlist сохраняется в БД (переживает перезапуск) и виден отдельным списком.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F2, C2, C3]
    tests: []
    notes: "Источники досок — публичные JSON Greenhouse/Lever и hh employer-id (docs/SOURCES.md §B, §D); стратегия опроса — ADR-0005"

  - id: FR-002
    title: Частый опрос watchlist + бейдж «🔥 fresh» + зона дайджеста
    statement: >-
      Система опрашивает доски watchlist-компаний чаще основного расписания
      (целевой интервал 3–4 ч) и выделяет свежие подходящие вакансии бейджем «🔥 fresh»
      в отдельной зоне дайджеста.
    acceptance:
      - Планировщик опрашивает watchlist с настраиваемым интервалом; дефолт — в диапазоне 3–4 ч, фактическая частота не превышает лимитов источника.
      - Вакансия, впервые замеченная watchlist-контуром в пределах настроенного окна свежести и прошедшая триаж/скоринг, получает бейдж «🔥 fresh».
      - Свежие watchlist-вакансии выводятся отдельной зоной в дайджесте, отличимой от обычного списка.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F2, C2, C3]
    tests: []
    notes: "Окно свежести и точный интервал — уточнить по лимитам источников (ADR-0005); «подходящая» = прошла триаж/скоринг"

  - id: FR-003
    title: Адаптация материалов под вакансию (черновик письма + подсказки к резюме)
    statement: >-
      В карточке вакансии по действию «Подготовить отклик» система формирует черновик
      сопроводительного письма под конкретную вакансию и подсказки по фокусу резюме
      (какие навыки/результаты вынести), опираясь на профиль владельца и требования вакансии.
    acceptance:
      - Из карточки вакансии доступно действие «Подготовить отклик»; результат — черновик письма и список подсказок к резюме.
      - Черновик опирается на требования вакансии и факты профиля, а не на общий шаблон (проверяется наличием в тексте конкретных фактов; порог — уточнить).
      - Отправку выполняет владелец вручную; сервис отклик сам не отправляет (кроме явно подтверждённого FR-005).
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F3, C4]
    tests: []
    notes: "Граница гибрида C4; де-LLM-слой — FR-004/ADR-0003"

  - id: FR-004
    title: Обязательный де-LLM постпроцессинг текстов отклика
    statement: >-
      Любой сгенерированный текст отклика (письмо, подсказки) проходит обязательный
      де-LLM постпроцессинг: чистку известных AI-маркеров и второй проход
      «живее/короче/конкретнее», чтобы финальный текст не выглядел LLM-сгенерированным.
    acceptance:
      - Текст не выдаётся владельцу без пройденного де-LLM-слоя; в штатном сценарии F3 слой нельзя отключить.
      - Слой убирает маркеры из поддерживаемого списка (канцелярит, «важно отметить», шаблонные тире, однотипный ритм) — проверяется набором тест-кейсов.
      - Финальный текст проходит проверку выбранным детектором/чекером маркеров (OSS либо набор правил) ниже заданного порога на тест-корпусе.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F3, C4, C7]
    tests: []
    notes: "ADR-0003 (гибрид: правила + второй LLM-проход); исследовать OSS-детекторы маркеров (C7; DISCOVERY §7.5); порог детектора — уточнить"

  - id: FR-005
    title: hh user-OAuth — полуавтоматика откликов с подтверждением и лимитами
    statement: >-
      Для hh.ru система по OAuth-токену владельца готовит отклик (сопроводительное +
      выбор резюме) и отправляет его только после явного подтверждения владельцем,
      соблюдая лимиты и паузы hh.
    acceptance:
      - Отклик уходит только после явного подтверждения владельцем; без подтверждения отправки не происходит.
      - Перед отправкой соблюдаются лимиты/паузы hh (число откликов в единицу времени настраиваемо); при достижении лимита отправка блокируется до сброса.
      - Режим массовой автоотправки без подтверждения отсутствует.
      - Результат отклика (успех / ошибка / LIMIT) фиксируется в воронке владельца.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F3, C4, C1]
    tests: []
    notes: "ADR-0004 (полуавто vs авто); контрпример НейроКарьера 60/день и позиция hh (DISCOVERY §2.1; docs/SOURCES.md §F); нужны credentials dev.hh.ru (SOURCES.md §B)"

  - id: FR-006
    title: Маркер «данные устарели N ч» в UI
    statement: >-
      Если источник недоступен и данные показаны из кэша, UI помечает контент
      маркером «данные устарели N ч» с фактическим возрастом данных.
    acceptance:
      - При показе данных старше настроенного порога свежести UI отображает маркер с числом часов.
      - Маркер считается по фактическому возрасту (now − время последнего успешного сбора), а не строкой-константой.
      - При свежих данных маркер не показывается.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F6, C5]
    tests: []
    notes: "DISCOVERY §6 (устойчивость), §5 F6"

  - id: FR-007
    title: Ротационный бэкап data/backups/
    statement: >-
      Система создаёт ротационные копии БД в data/backups/ и предоставляет команду
      восстановления из произвольной копии.
    acceptance:
      - Бэкап создаётся по расписанию/команде и складывается в data/backups/.
      - Старые копии ротируются (сохраняется не менее настроенного числа последних копий); ротация настраиваема.
      - Восстановление из выбранной копии выполняется командой CLI (в отдельный файл) без потери исходной БД.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [C1, C5]
    tests: []
    notes: "DISCOVERY §6; ADR-0001 (SQLite = копия файла); гарантии частоты/хранения/проверки восстановления — NFR-002"

  - id: NFR-001
    title: Производительность UI дайджеста
    statement: >-
      Страница дайджеста отдаётся на localhost (single-user) с p95 не выше
      зафиксированного порога при базе ≈5 000 вакансий.
    acceptance:
      - p95 времени ответа GET дайджеста ≤ порога при базе ≈5 000 записей; порог фиксируется в docs/TESTING.md до реализации (открытый вопрос).
      - "Замер воспроизводим: сидированная база ≈5 000 записей + скрипт прогона; результат логируется."
      - Порог не превышается на релизном прогоне.
    priority: should
    status: accepted
    release: v0.4.0
    traces: [F1, C5, C6]
    tests: []
    notes: "Числовой порог p95 — открытый вопрос (уточнить в TESTING.md); UI server-rendered (TESTING.md)"

  - id: NFR-002
    title: "Надёжность данных — бэкап: частота, хранение, проверка восстановления"
    statement: >-
      Данные БД бэкапируются регулярно с сохранением нескольких копий и проверяемым
      восстановлением; бэкап остаётся локальным.
    acceptance:
      - Бэкап выполняется не реже настроенной частоты (целевое — не реже 1 раза в сутки; точное значение уточнить).
      - Хранится не менее настроенного числа последних копий (значение уточнить); более старые удаляются ротацией.
      - Восстановление из бэкапа проверяется (тест/ритуал релиза) и воспроизводит работоспособную БД.
      - Бэкапы хранятся локально в data/backups/ и наружу не передаются.
    priority: should
    status: accepted
    release: v0.4.0
    traces: [C1, C5]
    tests: []
    notes: "Механика — FR-007; ADR-0001, DISCOVERY §6; частота и глубина ротации — открытый вопрос"

  - id: NFR-003
    title: Безопасность — хранение секретов
    statement: >-
      Все секреты (ключи источников, OAuth-токены hh) хранятся только в .env /
      переменных окружения JOB_HUNTER_* и не попадают в репозиторий, логи, UI и бэкапы.
    acceptance:
      - .env в .gitignore; секреты задаются только через env/SecretStr; хардкода и коммитов секретов нет.
      - Секреты маскируются в логах, UI и экспортах (не выводятся в открытом виде).
      - OAuth-токены hh хранятся локально и не покидают машину.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [C1, C6]
    tests: []
    notes: "AGENTS.md; opencode.jsonc (deny на *.env*, чтение только .env.example)"

  - id: NFR-004
    title: Ресурсная дисциплина LLM — ≤1 модель и явная выгрузка
    statement: >-
      В любой момент загружена не более одной локальной LLM; после батча модель явно
      выгружается, задачи обрабатываются последовательно (конкурентность 1).
    acceptance:
      - Телеметрия (/api/ps) показывает ≤1 загруженную модель во время и после батча; инвариант проверяется тестом/логом.
      - После батча выполняется явная выгрузка (Ollama keep_alive=0); модель отсутствует в памяти при проверке.
      - Задачи LLM обрабатываются последовательно (конкурентность 1); primary и fallback не загружены одновременно.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [C3]
    tests: []
    notes: "PLAN.md §7.1; DISCOVERY §6; требование владельца 12.10"

  - id: NFR-005
    title: Устойчивость — fail-open при сбоях источника/LLM
    statement: >-
      Сбой источника или LLM не ломает сервис: ошибки изолируются, LLM-триаж
      fail-open, UI показывает кэш/частичные данные с видимой деградацией.
    acceptance:
      - Ошибка одного источника не прерывает ingest остальных и не роняет планировщик.
      - При недоступности LLM триаж деградирует по правилу fail-open (не блокирует показ); состояние деградации видно.
      - При недоступности всех источников показывается кэш с маркером возраста (FR-006).
    priority: must
    status: accepted
    release: v0.4.0
    traces: [F5, F6, C3]
    tests: []
    notes: "DISCOVERY §6; TESTING.md (планировщик не запускает боевые задачи в тестах)"

  - id: NFR-006
    title: Доступность — localhost, single-user
    statement: >-
      Сервис работает локально одним процессом (web + scheduler на 127.0.0.1),
      без аутентификации и многопользовательского режима.
    acceptance:
      - Web слушает 127.0.0.1 и не публикуется наружу.
      - Auth / multi-user / аккаунтов нет; доступ равен доступу к машине.
      - Есть режим --no-scheduler для ручного запуска.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [C5]
    tests: []
    notes: "PRODUCT.md C5; DISCOVERY §6"

  - id: NFR-007
    title: Отсутствие утечек наружу (инвариант)
    statement: >-
      Никакие данные владельца (профиль, резюме, история поиска, отклики) не
      передаются на внешние сервисы; исходящие запросы ограничены белыми источниками
      вакансий и локальной LLM.
    acceptance:
      - Исходящие сетевые запросы ограничены официальными API/RSS источников и локальными LLM (проверяется инвариантом на список хостов/конфиг).
      - Телеметрии наружу нет; персданные не логируются в открытом виде.
      - Инвариант подтверждается тестом/код-ревью на запрет неизвестных хостов.
    priority: must
    status: accepted
    release: v0.4.0
    traces: [C1, C5]
    tests: []
    notes: "PRODUCT.md §2 (нулевые утечки), C1"
